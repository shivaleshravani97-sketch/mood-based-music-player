<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Moodify - Mood Based Music</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎵 Moodify</h1>
            <p>Music that matches your mood.</p>
        </header>

        <section class="mood-section">

            <h2>How are you feeling?</h2>

            <div class="moods">

                <button class="mood" data-mood="happy">
                    😊
                    <span>Happy</span>
                </button>

                <button class="mood" data-mood="sad">
                    😢
                    <span>Sad</span>
                </button>

                <button class="mood" data-mood="calm">
                    😌
                    <span>Calm</span>
                </button>

                <button class="mood" data-mood="energetic">
                    🔥
                    <span>Energetic</span>
                </button>

                <button class="mood" data-mood="romantic">
                    ❤️
                    <span>Romantic</span>
                </button>

            </div>

            <button id="findMusic">
                Find My Music
            </button>

        </section>


        <section class="playlist">

            <h2 id="playlistTitle">
                Choose a mood
            </h2>

            <div id="songs"></div>

        </section>


        <section class="player">

            <h3 id="currentSong">
                No song selected
            </h3>

            <audio id="audioPlayer" controls></audio>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
